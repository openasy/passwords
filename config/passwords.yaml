# The company's shared vaults, which Identity groups may see or change each, and the organization's policies. Passwords
# keeps Vaultwarden in step with this file: it is read again within a minute of a save, applied whole or not at all,
# and a mistake leaves the last good version in place (see the README).
#
# Each group gets read (see and use the items), edit (also add and change them) or manage (also manage the vault in
# the Bitwarden apps). A vault taken out of the file keeps its items: Passwords never deletes one.
vaults:
  - id: finance
    name: Finance
    access:
      finance-leads: manage
      finance: edit
  - id: it
    name: IT
    access:
      it-admins: manage
  - id: sales
    name: Sales
    access:
      sales: edit
  - id: marketing
    name: Marketing
    access:
      marketing: edit
  - id: office
    name: Office
    access:
      everyone: read

policies:
  # Members must use two-step login in Vaultwarden; those without it are shut out of the shared vaults until they add it.
  twoStepLogin: true
  masterPassword: { minLength: 14, minComplexity: 3 }
  passwordGenerator: { minLength: 20, useUpper: true, useLower: true, useNumbers: true, useSpecial: true }
